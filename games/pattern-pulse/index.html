<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pattern Pulse</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 20%,#282050,#090b18 70%);color:#fff;font:16px system-ui;display:grid;place-items:center}.app{width:min(94vw,520px);text-align:center}h1{letter-spacing:5px;color:#d2a5ff}.stats{display:flex;justify-content:space-around;color:#c9b7e6;margin:18px}.pads{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pad{aspect-ratio:1;border:0;border-radius:24px;opacity:.72;filter:saturate(.8);transition:.12s;cursor:pointer}.pad:active,.pad.lit{opacity:1;filter:brightness(1.7);transform:scale(.97);box-shadow:0 0 35px currentColor}.p0{background:#ff5379;color:#ff5379}.p1{background:#41d9bd;color:#41d9bd}.p2{background:#698bff;color:#698bff}.p3{background:#ffc857;color:#ffc857}.controls{display:flex;gap:8px;justify-content:center;margin:18px}.controls button{background:#292044;color:#fff;border:1px solid #7757a2;border-radius:9px;padding:10px 14px}.msg{min-height:28px;color:#d6c4ed}.small{color:#a99abd;font-size:13px}
</style></head><body><main class="app"><h1>PATTERN PULSE</h1><div class="stats"><span>Round <b id="round">0</b></span><span>Score <b id="score">0</b></span><span>Streak <b id="streak">0</b></span></div><div class="pads"><button class="pad p0" data-i="0" aria-label="Pink"></button><button class="pad p1" data-i="1" aria-label="Teal"></button><button class="pad p2" data-i="2" aria-label="Blue"></button><button class="pad p3" data-i="3" aria-label="Yellow"></button></div><p class="msg" id="msg">Watch the sequence, then repeat it in the same order.</p><div class="controls"><button id="start">Start</button><button id="strict">Mode: Normal</button></div><p class="small">Each round adds a new pulse. Normal mode lets you retry; strict mode ends your run on a mistake.</p></main><script>
const $=id=>document.getElementById(id),pads=[...document.querySelectorAll('.pad')];let seq=[],input=0,score=0,streak=0,round=0,strict=false,locked=true,playing=false;function sleep(t){return new Promise(r=>setTimeout(r,t))}async function flash(i){pads[i].classList.add('lit');await sleep(300);pads[i].classList.remove('lit');await sleep(120)}async function show(){locked=true;$('msg').textContent='Watch carefully…';await sleep(500);for(let i of seq){await flash(i)}locked=false;$('msg').textContent='Your turn — repeat the pattern.'}
async function next(){round++;$('round').textContent=round;seq.push(Math.floor(Math.random()*4));input=0;await show()}
function begin(){seq=[];input=0;score=0;streak=0;round=0;playing=true;$('score').textContent=0;$('streak').textContent=0;next()}$('start').onclick=begin;$('strict').onclick=()=>{strict=!strict;$('strict').textContent='Mode: '+(strict?'Strict':'Normal')};
pads.forEach(p=>p.onclick=async()=>{if(locked||!playing)return;let i=+p.dataset.i;flash(i);if(i!==seq[input]){streak=0;$('streak').textContent=0;if(strict){playing=false;locked=true;$('msg').textContent='Run ended. You reached round '+round+'. Press Start to try again.'}else{$('msg').textContent='Not quite — watch the pattern again.';await sleep(500);show()}return}input++;if(input===seq.length){streak++;score+=seq.length*10+streak*5;$('score').textContent=score;$('streak').textContent=streak;$('msg').textContent='Perfect! Get ready for the next round.';locked=true;await sleep(650);next()}}); 
</script></body></html>

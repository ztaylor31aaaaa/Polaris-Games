const forward=(keys.KeyW?1:0)-(keys.KeyS?1:0),side=(keys.KeyD?1:0)-(keys.KeyA?1:0),len=Math.hypot(forward,side)||1,speed=keys.ShiftLeft||keys.ShiftRight?12:7;const dx=(Math.sin(yaw)*forward+Math.cos(yaw)*side)*speed*dt/len,dz=(Math.cos(yaw)*forward-Math.sin(yaw)*side)*speed*dt/len;const nx=clamp(player.position.x+dx,-125,125),nz=clamp(player.position.z+dz,-125,125);player.position.x=nx;player.position.z=nz;state.x=nx;state.z=nz;player.position.y=terrainHeight(nx,nz)+Math.max(0,player.position.y-terrainHeight(nx,nz));if(keys.Space&&onGround){vy=8;onGround=false;}vy-=20*dt;player.position.y+=vy*dt;if(player.position.y<=terrainHeight(nx,nz)){player.position.y=terrainHeight(nx,nz);vy=0;onGround=true;}player.rotation.y=yaw;
camera.position.set(player.position.x-Math.sin(yaw)*8,player.position.y+5.2,player.position.z-Math.cos(yaw)*8);camera.lookAt(player.position.x,player.position.y+1.2,player.position.z);
for(const a of animals){a.timer-=dt;if(a.timer<=0){a.targetX=clamp(a.x+rand(-12,12),-115,115);a.targetZ=clamp(a.z+rand(-12,12),-115,115);a.timer=rand(3,8);}const vx=a.targetX-a.x,vz=a.targetZ-a.z,d=Math.hypot(vx,vz);if(d>.4){a.x+=vx/d*dt*1.6;a.z+=vz/d*dt*1.6;a.mesh.position.set(a.x,terrainHeight(a.x,a.z),a.z);a.mesh.rotation.y=Math.atan2(vx,vz);}}
const n=nearest();$('prompt').style.opacity=n?'1':'0';if(n)$('prompt').textContent='E · Gather '+n.label+' ('+n.amount+' '+n.type+')';$('loc').textContent=Math.hypot(nx,nz)>75?'THE OUTER WILDS':Math.hypot(nx,nz)>35?'MOSSWOOD FOREST':'THE GREENSHORE';
const hour=state.minute/60,night=hour<6||hour>19,t=clamp((Math.sin((hour-6)/13*Math.PI)+.2),.12,1);sun.intensity=.25+t*2.2;hemi.intensity=.45+t*1.25;scene.fog.color.set(night?0x182b38:0x9cc9c2);scene.background.set(night?0x182b38:0x9cc9c2);$('objective').textContent=state.crafted.includes('Stone axe')?'Explore the island and build a shelter.':'Gather wood and stone to craft your first tools.';updateHud();if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)$('toast').style.opacity=0;}if(Math.floor(elapsed)%12===0&&Math.floor(elapsed)!==update.lastSave){update.lastSave=Math.floor(elapsed);save();}}
update.lastSave=-1;
let last=performance.now();function loop(now){const dt=Math.min((now-last)/1000,.05);last=now;update(dt);renderer.render(scene,camera);requestAnimationFrame(loop);}requestAnimationFrame(loop);
setInterval(save,12000);addEventListener('beforeunload',save);

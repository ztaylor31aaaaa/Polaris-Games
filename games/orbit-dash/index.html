<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orbit Dash</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0,#173c70,#081426 65%);color:#edf6ff}.wrap{width:min(920px,96vw);padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.brand{font-size:clamp(20px,4vw,30px);font-weight:800;letter-spacing:-1px}.brand span{color:#66d9ff}.stats{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:8px 12px;border:1px solid #31557c;border-radius:999px;background:#102744;color:#cfe9ff;font-size:13px}canvas{display:block;width:100%;aspect-ratio:16/9;border:1px solid #31557c;border-radius:18px;background:#08172a;box-shadow:0 22px 70px #0008;touch-action:none}.bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;color:#9db9d7;font-size:13px;flex-wrap:wrap}button{border:1px solid #5b9ed5;border-radius:10px;padding:10px 16px;background:linear-gradient(135deg,#278bd5,#2462bd);color:white;font-weight:700;cursor:pointer}button:hover{filter:brightness(1.15)}.hint{opacity:.8}@media(max-width:520px){.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<main class="wrap">
 <div class="top"><div class="brand">ORBIT <span>DASH</span></div><div class="stats"><div class="pill">Score: <b id="score">0</b></div><div class="pill">Best: <b id="best">0</b></div></div></div>
 <canvas id="game" width="960" height="540" aria-label="Orbit Dash game"></canvas>
 <div class="bottom"><span class="hint">Move with WASD / arrow keys, or drag on the screen. Collect blue energy orbs.</span><button id="start">Start game</button></div>
</main>
<script>
(()=>{
const canvas=document.querySelector("#game"),ctx=canvas.getContext("2d"),scoreEl=document.querySelector("#score"),bestEl=document.querySelector("#best"),startBtn=document.querySelector("#start");
const W=canvas.width,H=canvas.height,keys=new Set();let player,orbs,stars,score,best=Number(localStorage.getItem("orbit-dash-best")||0),running=false,frame=0,last=0;
bestEl.textContent=best;
function reset(){player={x:W/2,y:H*.78,r:15,speed:5};orbs=[];stars=Array.from({length:90},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+.4,s:Math.random()*.8+.25}));score=0;frame=0;scoreEl.textContent=0}
function spawn(){orbs.push({x:45+Math.random()*(W-90),y:-20,r:9+Math.random()*5,s:2+Math.random()*2,p:Math.random()*6})}
function draw(){ctx.clearRect(0,0,W,H);const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,"#102b4d");g.addColorStop(1,"#071426");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
for(const s of stars){s.y+=s.s;if(s.y>H)s.y=0;ctx.globalAlpha=.35+s.r*.2;ctx.fillStyle="#c5eaff";ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
ctx.strokeStyle="#315b86";ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(W/2,H*.52,Math.min(W*.39,370),H*.25,0,0,Math.PI*2);ctx.stroke();
for(const o of orbs){o.y+=o.s;o.p+=.08;ctx.shadowBlur=18;ctx.shadowColor="#53dfff";ctx.fillStyle="#72eaff";ctx.beginPath();ctx.arc(o.x,o.y+Math.sin(o.p)*4,o.r,0,Math.PI*2);ctx.fill()}ctx.shadowBlur=0;
ctx.save();ctx.translate(player.x,player.y);ctx.rotate(Math.sin(frame*.04)*.08);ctx.shadowBlur=20;ctx.shadowColor="#55baff";ctx.fillStyle="#f3fbff";ctx.beginPath();ctx.moveTo(0,-20);ctx.lineTo(15,16);ctx.lineTo(0,10);ctx.lineTo(-15,16);ctx.closePath();ctx.fill();ctx.fillStyle="#55ddff";ctx.beginPath();ctx.arc(0,-3,5,0,Math.PI*2);ctx.fill();ctx.restore();
if(!running){ctx.fillStyle="#061326aa";ctx.fillRect(0,0,W,H);ctx.textAlign="center";ctx.fillStyle="#f3f8ff";ctx.font="700 42px system-ui";ctx.fillText(score?"Nice run!":"Ready for orbit?",W/2,H/2-8);ctx.fillStyle="#b5d6f5";ctx.font="18px system-ui";ctx.fillText("Press Start to play",W/2,H/2+28)}}
function tick(t){if(!running){draw();return}const dt=Math.min(32,t-last||16);last=t;frame++;const v=player.speed*dt/16.67;if(keys.has("ArrowLeft")||keys.has("a"))player.x-=v;if(keys.has("ArrowRight")||keys.has("d"))player.x+=v;if(keys.has("ArrowUp")||keys.has("w"))player.y-=v;if(keys.has("ArrowDown")||keys.has("s"))player.y+=v;player.x=Math.max(22,Math.min(W-22,player.x));player.y=Math.max(25,Math.min(H-25,player.y));if(frame%42===0)spawn();for(let i=orbs.length-1;i>=0;i--){const o=orbs[i];if(Math.hypot(player.x-o.x,player.y-o.y)<player.r+o.r){orbs.splice(i,1);score+=10;scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;localStorage.setItem("orbit-dash-best",best)}}else if(o.y>H+30)orbs.splice(i,1)}draw();requestAnimationFrame(tick)}
function start(){reset();running=true;last=performance.now();startBtn.textContent="Restart";requestAnimationFrame(tick)}
startBtn.addEventListener("click",start);window.addEventListener("keydown",e=>{if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();keys.add(e.key);if(!running&&e.key==="Enter")start()});window.addEventListener("keyup",e=>keys.delete(e.key));
function point(e){const r=canvas.getBoundingClientRect();player.x=(e.clientX-r.left)*W/r.width;player.y=(e.clientY-r.top)*H/r.height}canvas.addEventListener("pointerdown",e=>{canvas.setPointerCapture(e.pointerId);point(e)});canvas.addEventListener("pointermove",e=>{if(e.buttons)point(e)});
reset();draw();
})();
</script>
</body></html>

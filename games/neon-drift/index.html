<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Neon Drift</title><style>
*{box-sizing:border-box}body{margin:0;background:#080b18;color:#eef;font:15px system-ui;display:grid;place-items:center;min-height:100vh}.wrap{width:min(96vw,900px)}header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0}h1{margin:0;color:#63f5e2;letter-spacing:3px}button{background:#17233b;color:#fff;border:1px solid #3a6684;border-radius:9px;padding:9px 14px;font-weight:700}canvas{width:100%;background:#101a2c;border:2px solid #24506b;border-radius:14px;display:block;touch-action:none}.stats{display:flex;gap:16px;color:#a8c9e7}.help{text-align:center;color:#9cb3ca;font-size:13px;margin:9px}.overlay{position:fixed;inset:0;background:#050817dd;display:grid;place-items:center}.panel{background:#111d32;border:1px solid #3b7890;border-radius:18px;padding:28px;text-align:center;width:min(90vw,420px)}.panel h2{color:#65f4df;font-size:30px;margin:0 0 8px}.panel p{color:#bdd0e3;line-height:1.5}.panel button{background:#087e83;font-size:16px}.hide{display:none}.touch{display:none;justify-content:space-between;margin-top:8px}.touch button{width:30%;font-size:20px}@media(max-width:650px){.touch{display:flex}.help{font-size:11px}}
</style></head><body><main class="wrap"><header><h1>NEON DRIFT</h1><div class="stats"><span>🏁 Lap <b id="lap">0</b>/3</span><span>⚡ <b id="boost">100</b>%</span><span>🏆 <b id="best">--</b></span></div><button id="pause">Pause</button></header><canvas id="game" width="900" height="560"></canvas><div class="touch"><button data-k="ArrowLeft">◀</button><button data-k="ArrowUp">▲ BOOST</button><button data-k="ArrowRight">▶</button></div><p class="help">ARROWS / WASD to steer · SPACE to boost · Complete 3 laps · Hit the glowing cyan pads!</p></main><div class="overlay" id="cover"><div class="panel"><h2>NEON DRIFT</h2><p>Master the corners, collect boost pads and beat your best time. Avoid the track barriers and traffic drones.</p><button id="start">START RACE</button></div></div><script>
const c=document.querySelector('canvas'),x=c.getContext('2d'),keys={},$=id=>document.getElementById(id);let running=false,paused=false,car,traffic,pads,lap,boost,tick,best=+(localStorage.ndBest||0),last=0;
$('best').textContent=best?best.toFixed(1)+'s':'--';function reset(){car={x:450,y:480,a:-Math.PI/2,v:0};traffic=[{x:450,y:170,v:1.4},{x:300,y:300,v:1.1},{x:600,y:380,v:1.25}];pads=[{x:300,y:100,on:true},{x:600,y:100,on:true},{x:300,y:450,on:true},{x:600,y:450,on:true}];lap=0;boost=100;tick=0;$('lap').textContent=0;$('boost').textContent=100}
function start(){reset();running=true;paused=false;$('cover').classList.add('hide');last=performance.now();requestAnimationFrame(loop)}$('start').onclick=start;$('pause').onclick=()=>{if(!running)return;paused=!paused;$('pause').textContent=paused?'Resume':'Pause';if(!paused){last=performance.now();requestAnimationFrame(loop)}};
onkeydown=e=>{keys[e.key.toLowerCase()]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key==='Escape'&&running)$('pause').click()};onkeyup=e=>keys[e.key.toLowerCase()]=false;document.querySelectorAll('[data-k]').forEach(b=>{b.onpointerdown=()=>keys[b.dataset.k.toLowerCase()]=true;b.onpointerup=b.onpointerleave=()=>keys[b.dataset.k.toLowerCase()]=false});
function track(){x.fillStyle='#102035';x.fillRect(0,0,900,560);x.strokeStyle='#263c54';x.lineWidth=175;x.strokeRect(145,65,610,430);x.strokeStyle='#55d7ce';x.lineWidth=3;x.setLineDash([22,18]);x.strokeRect(145,65,610,430);x.setLineDash([]);x.fillStyle='#0a1221';x.fillRect(225,145,450,270);x.fillStyle='#182d40';x.fillRect(390,145,120,270);x.fillStyle='#31536a';for(let i=0;i<8;i++){x.fillRect(150+i*8,275,5,10)}}
function draw(){track();pads.forEach(p=>{if(p.on){x.fillStyle='#49ffe0';x.shadowBlur=20;x.shadowColor='#49ffe0';x.beginPath();x.arc(p.x,p.y,13,0,7);x.fill();x.shadowBlur=0}});traffic.forEach(t=>{x.fillStyle='#f56b9d';x.fillRect(t.x-11,t.y-18,22,36)});x.save();x.translate(car.x,car.y);x.rotate(car.a);x.fillStyle='#fff';x.shadowBlur=18;x.shadowColor='#49ffe0';x.fillRect(-10,-18,20,36);x.fillStyle='#49ffe0';x.fillRect(-7,-10,14,12);x.restore();x.fillStyle='#fff';x.font='14px system-ui';x.fillText('FINISH',410,55)}
function loop(now){if(!running||paused)return;let dt=Math.min((now-last)/16,2);last=now;tick+=dt/60;let left=keys.arrowleft||keys.a,right=keys.arrowright||keys.d,up=keys.arrowup||keys.w,down=keys.arrowdown||keys.s,fast=(keys[' ']||keys.shift)&&boost>0;if(left)car.a-=.055*dt;if(right)car.a+=.055*dt;car.v+=(up?.12:0)-(down?.1:0);car.v*=.985;if(fast){car.v+=.12*dt;boost=Math.max(0,boost-.55*dt)}else boost=Math.min(100,boost+.12*dt);car.v=Math.max(-2.5,Math.min(fast?8:5,car.v));car.x+=Math.cos(car.a)*car.v*dt;car.y+=Math.sin(car.a)*car.v*dt;
if(car.x<220||car.x>680||car.y<140||car.y>420){car.v*=.93;if(car.x<220||car.x>680||car.y<140||car.y>420)car.v*=.94}
traffic.forEach(t=>{t.y+=t.v*dt;if(t.y>420)t.y=140;if(Math.hypot(car.x-t.x,car.y-t.y)<28)car.v*=.65});
pads.forEach(p=>{if(p.on&&Math.hypot(car.x-p.x,car.y-p.y)<28){p.on=false;boost=Math.min(100,boost+35)}});
if(car.y<70&&car.x>390&&car.x<510&&car.v>1){lap++;$('lap').textContent=Math.min(lap,3);car.y=75;if(lap>=3){running=false;if(!best||tick<best){best=tick;localStorage.ndBest=best;$('best').textContent=best.toFixed(1)+'s'}$('cover').classList.remove('hide');$('cover').querySelector('h2').textContent='RACE COMPLETE';$('cover').querySelector('p').textContent='Time: '+tick.toFixed(1)+' seconds. Best: '+best.toFixed(1)+' seconds.';$('start').textContent='RACE AGAIN'}}
$('boost').textContent=Math.round(boost);draw();requestAnimationFrame(loop)}reset();draw();
</script></body></html>

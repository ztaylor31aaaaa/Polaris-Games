<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Star Salvager</title><style>
*{box-sizing:border-box}body{margin:0;background:#070b17;color:#eaf4ff;font:15px system-ui;display:grid;place-items:center;min-height:100vh}.wrap{width:min(95vw,850px)}header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}h1{color:#8de1ff;letter-spacing:3px;margin:8px 0}.stats{display:flex;gap:15px;color:#a9c8dc}canvas{width:100%;display:block;border:1px solid #294b70;border-radius:14px;background:#090f20;touch-action:none}button{background:#162b47;border:1px solid #41688a;color:#fff;padding:9px 13px;border-radius:9px}.help{text-align:center;color:#9db5cc;font-size:13px}.controls{display:flex;justify-content:center;gap:8px}.controls button{min-width:65px;font-size:19px}
</style></head><body><main class="wrap"><header><h1>STAR SALVAGER</h1><div class="stats"><span>Credits <b id="cash">0</b></span><span>Cargo <b id="cargo">0/3</b></span><span>Hull <b id="hull">100</b>%</span></div><button id="upgrade">Upgrade engine · 30</button></header><canvas id="c" width="820" height="520"></canvas><div class="controls"><button data-k="a">◀</button><button data-k="w">▲</button><button data-k="s">▼</button><button data-k="d">▶</button><button data-k=" ">TRACTOR</button></div><p class="help">WASD / arrows to fly · Hold SPACE near cargo to tractor it in · Return cargo to the blue station · Avoid red mines.</p></main><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),$=id=>document.getElementById(id),keys={};let ship,items,mines,stars,cash=0,hull=100,cargo=0,engine=1,frame=0;function reset(){ship={x:410,y:260,vx:0,vy:0,a:0};items=Array.from({length:9},(_,i)=>({x:60+Math.random()*700,y:40+Math.random()*440,r:9+Math.random()*5,got:false}));mines=Array.from({length:7},()=>({x:40+Math.random()*740,y:30+Math.random()*460,a:Math.random()*6}));stars=Array.from({length:100},()=>({x:Math.random()*820,y:Math.random()*520,s:Math.random()*2}))}reset();
onkeydown=e=>{keys[e.key.toLowerCase()]=true;if(e.key.startsWith('Arrow')||e.key===' ')e.preventDefault()};onkeyup=e=>keys[e.key.toLowerCase()]=false;document.querySelectorAll('[data-k]').forEach(b=>{b.onpointerdown=()=>keys[b.dataset.k]=true;b.onpointerup=b.onpointerleave=()=>keys[b.dataset.k]=false});
$('upgrade').onclick=()=>{let cost=30*engine;if(cash>=cost){cash-=cost;engine++;$('upgrade').textContent='Upgrade engine · '+30*engine;ui()}};
function ui(){$('cash').textContent=cash;$('cargo').textContent=cargo+'/3';$('hull').textContent=Math.max(0,Math.round(hull))}
function draw(){g.fillStyle='#080e20';g.fillRect(0,0,820,520);stars.forEach(s=>{g.fillStyle='#7faacb';g.fillRect(s.x,s.y,s.s,s.s)});g.strokeStyle='#285d88';g.lineWidth=3;g.beginPath();g.arc(410,260,42,0,7);g.stroke();g.fillStyle='#173e60';g.fillText('SALVAGE BAY',375,265);items.forEach(o=>{if(o.got)return;g.fillStyle='#f7c76a';g.beginPath();g.arc(o.x,o.y,o.r,0,7);g.fill();g.strokeStyle='#fff0b0';g.stroke()});mines.forEach(m=>{g.fillStyle='#f35b70';g.beginPath();g.arc(m.x,m.y,9,0,7);g.fill();g.strokeStyle='#ff9ba7';g.beginPath();g.moveTo(m.x-13,m.y);g.lineTo(m.x+13,m.y);g.moveTo(m.x,m.y-13);g.lineTo(m.x,m.y+13);g.stroke()});g.save();g.translate(ship.x,ship.y);g.rotate(ship.a);g.fillStyle='#73e5ff';g.beginPath();g.moveTo(17,0);g.lineTo(-12,-10);g.lineTo(-7,0);g.lineTo(-12,10);g.closePath();g.fill();g.restore();if(keys[' ']){g.strokeStyle='#58f4d7';g.beginPath();g.arc(ship.x,ship.y,45,0,7);g.stroke()}}
function loop(){frame++;let ax=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),ay=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);ship.vx+=ax*.13*engine;ship.vy+=ay*.13*engine;ship.vx*=.985;ship.vy*=.985;ship.x+=ship.vx;ship.y+=ship.vy;ship.x=Math.max(12,Math.min(808,ship.x));ship.y=Math.max(12,Math.min(508,ship.y));if(Math.hypot(ship.vx,ship.vy)>.2)ship.a=Math.atan2(ship.vy,ship.vx);
if(keys[' ']){let near=items.filter(o=>!o.got&&Math.hypot(o.x-ship.x,o.y-ship.y)<75).sort((a,b)=>Math.hypot(a.x-ship.x,a.y-ship.y)-Math.hypot(b.x-ship.x,b.y-ship.y))[0];if(near&&cargo<3){near.got=true;cargo++;ui()}}
if(Math.hypot(ship.x-410,ship.y-260)<48&&cargo){cash+=cargo*10;cargo=0;ui()}
mines.forEach(m=>{m.a+=.02;m.x+=Math.cos(m.a)*.3;m.y+=Math.sin(m.a)*.3;if(Math.hypot(m.x-ship.x,m.y-ship.y)<20){hull-=.12;ship.vx*=.8;ship.vy*=.8;ui()}});if(hull<=0){hull=100;cash=Math.max(0,cash-15);cargo=0;reset();ui()}draw();requestAnimationFrame(loop)}loop();ui();
</script></body></html>
